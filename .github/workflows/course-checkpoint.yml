name: Course checkpoint
on:
  push:
    branches: ['course/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm --prefix client test
      - run: npm audit --prefix client --audit-level=moderate
      - run: npm run build
      - run: dotnet build Wardrobe.sln -m:1 -p:UseSharedCompilation=false
      - run: dotnet test Wardrobe.sln --no-build -m:1 -p:UseSharedCompilation=false
