name: Course checkpoint
on:
  push:
    branches: ['course/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Wardrobe.sln -m:1 -p:UseSharedCompilation=false
