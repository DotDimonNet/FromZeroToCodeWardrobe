name: Build and test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --prefix client
      - run: npm --prefix client test
      - run: npm audit --prefix client --audit-level=moderate
      - run: npm run build
      - run: dotnet test Wardrobe.sln -c Release -m:1 -p:UseSharedCompilation=false --logger trx --results-directory TestResults
      - run: dotnet publish src/Wardrobe.Api -c Release -o artifacts/app -m:1 -p:UseSharedCompilation=false
      - uses: actions/upload-artifact@v4
        with:
          name: thread-wardrobe
          path: artifacts/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
